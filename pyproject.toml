[build-system]
requires = ["setuptools", "wheel", "pydantic", "grpcio-tools==1.70.0", "cython"]
build-backend = "setuptools.build_meta"

# Keep linting and type checking config only, remove setuptools configuration
# All package configuration is in setup.py

[tool.ruff]
target-version = "py39"
line-length = 100
exclude = ["cytation.py", "CLARIOstar.py"]

[tool.ruff.lint]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
disallow_untyped_defs = "True"
disallow_any_unimported = "False"
no_implicit_optional = "True"
check_untyped_defs = "True"
warn_return_any = "True"
warn_unused_ignores = "False"
show_error_codes = "True"
follow_imports = "silent"
disable_error_code = ["misc", "var-annotated"]
exclude = ['.*pb2.*', 'pyi$', 'cytation.py', "teach_pendant","opentrons", "CLARIOstar.py"]

[[tool.mypy.overrides]]
module = ""
ignore_missing_imports = true

# pydantic >= 2.14 uses `match` statements, which mypy refuses to parse when
# python_version is 3.9. The project still supports 3.9, so keep that target and
# do not analyse pydantic's own sources (its public API is still typed via Any).
[[tool.mypy.overrides]]
module = ["pydantic", "pydantic.*"]
follow_imports = "skip"
